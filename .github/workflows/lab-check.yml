name: Lab 02 Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: |
          python scripts/download_data.py

      - name: Check repository and notebook structure
        run: |
          python tests/check_lab02.py

      - name: Execute notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute Lab02_KNN.ipynb \
            --output executed_Lab02_KNN.ipynb \
            --ExecutePreprocessor.timeout=240

      - name: Run KNN from-scratch unit tests
        run: |
          python -m pytest -q tests/test_knn_manual.py
